<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dayflow — Personal Finance & Productivity App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F4F1FE',
              100: '#EAE4FC',
              200: '#D5C9FA',
              300: '#B7A2F6',
              400: '#9170F2',
              500: '#6D42EF',
              600: '#6338E8',
              700: '#5028CE',
              800: '#4222A8',
            },
            ink: {
              900: '#191627',
              700: '#3C3752',
              500: '#7B768F',
              400: '#9E99B0',
            }
          },
          boxShadow: {
            'card': '0 6px 22px -4px rgba(99, 56, 232, 0.06), 0 2px 6px -1px rgba(25, 22, 39, 0.03)',
            'hero': '0 14px 28px -6px rgba(99, 56, 232, 0.34)',
            'fab': '0 8px 20px -2px rgba(99, 56, 232, 0.45)',
            'phone': '0 30px 70px -15px rgba(48, 28, 117, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.8)',
          }
        }
      }
    };
  </script>

  <style>
    /* Base showcase background matching the reference image */
    body {
      background: linear-gradient(145deg, #EDE6FD 0%, #E2D7FA 50%, #ECE5FD 100%);
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      color: #191627;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbars inside the mobile viewport while keeping smooth scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Smooth screen transition */
    .screen-enter {
      animation: fadeSlideIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Bottom sheet slide up animation */
    .sheet-enter {
      animation: sheetUp 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes sheetUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Hero card ambient wave highlight */
    .hero-purple-card {
      background: linear-gradient(135deg, #7B4FF8 0%, #5B30E5 100%);
      position: relative;
      overflow: hidden;
    }
    .hero-purple-card::before {
      content: '';
      position: absolute;
      top: -35%;
      right: -15%;
      width: 210px;
      height: 210px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }
    .hero-purple-card::after {
      content: '';
      position: absolute;
      bottom: -45%;
      left: 10%;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }

    /* Soft lavender savings banner gradient */
    .savings-banner-card {
      background: linear-gradient(135deg, #EFEAFC 0%, #DDD2FA 100%);
      position: relative;
      overflow: hidden;
    }

    /* Sculpted notched bottom bar shadow & glossy purple FAB */
    .notched-nav-svg {
      filter: drop-shadow(0 -6px 18px rgba(46, 30, 112, 0.065));
    }
    .fab-purple-orb {
      background: radial-gradient(circle at 32% 28%, #8258FA 0%, #6338E8 62%, #5329D6 100%);
      box-shadow: 0 8px 18px -2px rgba(99, 56, 232, 0.42);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-4 px-3 sm:py-6">

  <!-- Top Screen Quick-Switcher Bar (Allows instant inspection of all 7 screens from the mockup) -->
  <div class="w-full max-w-4xl mb-4 flex flex-col items-center gap-2">
    <div class="flex flex-wrap items-center justify-center gap-1.5 bg-white/75 backdrop-blur-md px-3 py-2 rounded-2xl shadow-sm border border-white/80">
      <span class="text-[11px] font-semibold text-ink-500 uppercase tracking-wider px-2 hidden md:inline">Screens:</span>
      <button onclick="navigateTo('home')" data-nav-pill="home" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm">
        1. Home
      </button>
      <button onclick="navigateTo('wallet')" data-nav-pill="wallet" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        2. My Wallet
      </button>
      <button onclick="navigateTo('savings')" data-nav-pill="savings" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        3. Savings
      </button>
      <button onclick="navigateTo('tasks')" data-nav-pill="tasks" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        4. Tasks
      </button>
      <button onclick="navigateTo('schedule')" data-nav-pill="schedule" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        5. Schedule
      </button>
      <button onclick="openAddNewModal()" data-nav-pill="modal" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        6. Add New Modal
      </button>
      <button onclick="navigateTo('profile')" data-nav-pill="profile" class="nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50">
        7. Profile
      </button>
    </div>
  </div>

  <!-- Mobile Device Frame (Exact iOS aspect ratio 390 x 836) -->
  <div id="phone-frame" class="relative w-full max-w-[390px] h-[820px] sm:h-[836px] bg-[#F8F7FC] rounded-[44px] shadow-phone overflow-hidden flex flex-col border-[6px] border-white select-none">

    <!-- iOS Status Bar (9:41 + Signal, Wifi, Battery) -->
    <div id="ios-status-bar" class="relative z-30 flex items-center justify-between px-7 pt-3.5 pb-1.5 text-[13px] font-bold text-ink-900 shrink-0 transition-colors">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <!-- Cellular Signal -->
        <svg class="w-4 h-3 text-ink-900" viewBox="0 0 18 12" fill="currentColor">
          <rect x="1" y="8" width="2.6" height="4" rx="0.8"/>
          <rect x="5.2" y="5.8" width="2.6" height="6.2" rx="0.8"/>
          <rect x="9.4" y="3.2" width="2.6" height="8.8" rx="0.8"/>
          <rect x="13.6" y="0.8" width="2.6" height="11.2" rx="0.8"/>
        </svg>
        <!-- Wi-Fi -->
        <svg class="w-4 h-3 text-ink-900" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.6a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zm-3.6-2.1a5.2 5.2 0 017.2 0l1.1-1.2a6.8 6.8 0 00-9.4 0l1.1 1.2zm-2.5-2.6a8.8 8.8 0 0112.2 0l1.1-1.2a10.4 10.4 0 00-14.4 0l1.1 1.2z"/>
        </svg>
        <!-- Battery -->
        <div class="flex items-center">
          <div class="w-[22px] h-[11px] rounded-[3.5px] border border-ink-900/80 p-[1.5px] flex items-center">
            <div class="w-full h-full bg-ink-900 rounded-[1.5px]"></div>
          </div>
          <div class="w-[1.5px] h-[4px] bg-ink-900/80 rounded-r-sm ml-[1px]"></div>
        </div>
      </div>
    </div>

    <!-- Main Dynamic Screen Viewport -->
    <main id="screen-container" class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
      <!-- Content injected dynamically by JS -->
    </main>

    <!-- Sculpted Notched Bottom Navigation Bar (Exact match to reference cutout & solid icons) -->
    <nav id="bottom-nav" class="relative z-20 h-[88px] shrink-0 select-none">
      <!-- Custom SVG Curved Cutout Background -->
      <svg class="notched-nav-svg absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 378 88" preserveAspectRatio="none" fill="none">
        <path d="M0 44 Q0 18 26 18 L138 18 C148 18 153 22 155.5 30 A33.5 33.5 0 0 0 222.5 30 C225 22 230 18 240 18 L352 18 Q378 18 378 44 L378 88 L0 88 Z" fill="#FFFFFF"/>
      </svg>

      <!-- Center Floating Purple '+' Button nestled inside the curved cradle -->
      <button onclick="openAddNewModal()" class="fab-purple-orb absolute left-1/2 -translate-x-1/2 top-[1px] w-[52px] h-[52px] rounded-full hover:brightness-105 active:scale-95 text-white flex items-center justify-center transition-all z-10" aria-label="Add New">
        <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m7-7H5"/>
        </svg>
      </button>

      <!-- 4 Solid Navigation Icons -->
      <div class="relative z-10 flex items-center justify-between px-7 pt-[31px]">
        <!-- Left Pair: Home & Pie Chart -->
        <div class="flex items-center gap-8">
          <!-- Home Tab (Solid House with Arched Door) -->
          <button onclick="navigateTo('home')" id="tab-home" class="p-1.5 rounded-xl transition-colors text-brand-600" aria-label="Home">
            <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.3 3.3a1.2 1.2 0 0 1 1.4 0l7.5 5.8c.5.4.8 1 .8 1.6V19a2 2 0 0 1-2 2h-4.2a.8.8 0 0 1-.8-.8v-4.4a2 2 0 0 0-4 0v4.4a.8.8 0 0 1-.8.8H5a2 2 0 0 1-2-2v-8.3c0-.6.3-1.2.8-1.6l7.5-5.8Z"/>
            </svg>
          </button>

          <!-- Wallet / Analytics Tab (Solid 3-Slice Pie Chart) -->
          <button onclick="navigateTo('wallet')" id="tab-wallet" class="p-1.5 rounded-xl transition-colors text-[#827C99] hover:text-brand-600" aria-label="My Wallet">
            <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.1 3.05a9 9 0 0 0 0 17.9V3.05Z"/>
              <path d="M12.9 3.05v8.05h8.05a9.02 9.02 0 0 0-8.05-8.05Z"/>
              <path d="M12.9 12.9v8.05a9.02 9.02 0 0 0 8.05-8.05H12.9Z"/>
            </svg>
          </button>
        </div>

        <!-- Right Pair: Schedule Calendar & Settings Gear -->
        <div class="flex items-center gap-8">
          <!-- Schedule / Calendar Tab (Solid Calendar with Dots) -->
          <button onclick="navigateTo('schedule')" id="tab-schedule" class="p-1.5 rounded-xl transition-colors text-[#827C99] hover:text-brand-600" aria-label="Schedule">
            <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M7.5 2.5a1 1 0 0 1 1 1V5h7V3.5a1 1 0 1 1 2 0V5H19a2.5 2.5 0 0 1 2.5 2.5v11A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-11A2.5 2.5 0 0 1 5 5h1.5V3.5a1 1 0 0 1 1-1ZM5 9.5v9a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-9H5Z"/>
              <rect x="7" y="12.2" width="1.8" height="1.8" rx="0.5"/>
              <rect x="10" y="12.2" width="1.8" height="1.8" rx="0.5"/>
              <rect x="13" y="12.2" width="1.8" height="1.8" rx="0.5"/>
              <rect x="15.5" y="14.5" width="2.2" height="2.2" rx="0.6"/>
            </svg>
          </button>

          <!-- Settings / Profile Tab (Solid 8-Tooth Cogwheel) -->
          <button onclick="navigateTo('profile')" id="tab-profile" class="p-1.5 rounded-xl transition-colors text-[#827C99] hover:text-brand-600" aria-label="Settings & Profile">
            <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10.4 2.7a1.7 1.7 0 0 1 3.2 0l.3 1.1c.4.1.8.3 1.2.5l1-.5a1.7 1.7 0 0 1 2.3 2.3l-.5 1c.2.4.4.8.5 1.2l1.1.3a1.7 1.7 0 0 1 0 3.2l-1.1.3c-.1.4-.3.8-.5 1.2l.5 1a1.7 1.7 0 0 1-2.3 2.3l-1-.5c-.4.2-.8.4-1.2.5l-.3 1.1a1.7 1.7 0 0 1-3.2 0l-.3-1.1a6.4 6.4 0 0 1-1.2-.5l-1 .5a1.7 1.7 0 0 1-2.3-2.3l.5-1a6.4 6.4 0 0 1-.5-1.2l-1.1-.3a1.7 1.7 0 0 1 0-3.2l1.1-.3c.1-.4.3-.8.5-1.2l-.5-1a1.7 1.7 0 0 1 2.3-2.3l1 .5c.4-.2.8-.4 1.2-.5l.3-1.1ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Integrated iOS Home Indicator Bar -->
      <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-10">
        <div class="w-32 h-[4.5px] bg-ink-900 rounded-full"></div>
      </div>
    </nav>

    <!-- Standalone iOS Home Indicator Bar (Shown only on Profile screen where bottom nav is hidden) -->
    <div id="ios-home-bar" class="hidden bg-[#F8F7FC] pt-1 pb-2 flex justify-center shrink-0 z-30">
      <div class="w-32 h-[4.5px] bg-ink-900 rounded-full"></div>
    </div>

    <!-- In-App Toast Notification Banner -->
    <div id="app-toast" class="pointer-events-none absolute top-14 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 transform -translate-y-2">
      <div class="bg-ink-900/90 backdrop-blur-md text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg flex items-center gap-2 whitespace-nowrap">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="app-toast-text">Action completed</span>
      </div>
    </div>

    <!-- Screen 6: "Add New" Bottom Sheet Modal Overlay -->
    <div id="add-new-modal" class="hidden absolute inset-0 z-40 flex flex-col justify-end bg-[#141122]/55 backdrop-blur-[1.5px] transition-opacity">
      <!-- Backdrop click to close -->
      <div class="flex-1" onclick="closeAddNewModal()"></div>

      <!-- Bottom Sheet Card -->
      <div id="modal-sheet-content" class="sheet-enter bg-white mx-2.5 mb-2.5 rounded-[30px] p-5 shadow-2xl">
        <!-- Main 4-Option Menu (Exact match to Screen 6 in showcase) -->
        <div id="modal-menu-view">
          <h3 class="text-center text-[17px] font-bold text-ink-900 mb-4">Add New</h3>

          <div class="divide-y divide-gray-100">
            <!-- 1. Add Expense -->
            <button onclick="openSubForm('expense')" class="w-full flex items-center gap-3.5 py-3 px-1.5 hover:bg-brand-50/60 rounded-xl transition-colors text-left group">
              <div class="w-11 h-11 rounded-2xl bg-[#FCE7EE] text-[#E11D48] flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="6" width="18" height="13" rx="3"/>
                  <path d="M16 12.5h2.5"/>
                  <path d="M7 6V4.5A1.5 1.5 0 018.5 3h7A1.5 1.5 0 0117 4.5V6"/>
                </svg>
              </div>
              <div>
                <div class="text-[14px] font-bold text-ink-900">Add Expense</div>
                <div class="text-[12px] text-ink-500">Track your spending</div>
              </div>
            </button>

            <!-- 2. Create Savings Goal -->
            <button onclick="openSubForm('goal')" class="w-full flex items-center gap-3.5 py-3 px-1.5 hover:bg-brand-50/60 rounded-xl transition-colors text-left group">
              <div class="w-11 h-11 rounded-2xl bg-[#E3F7ED] text-[#16A34A] flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 7H5a2 2 0 00-2 2v8a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2z"/>
                  <path d="M16 13h2"/>
                  <path d="M6 7V5a2 2 0 012-2h8a2 2 0 012 2v2"/>
                </svg>
              </div>
              <div>
                <div class="text-[14px] font-bold text-ink-900">Create Savings Goal</div>
                <div class="text-[12px] text-ink-500">Save for your dreams</div>
              </div>
            </button>

            <!-- 3. Create Task -->
            <button onclick="openSubForm('task')" class="w-full flex items-center gap-3.5 py-3 px-1.5 hover:bg-brand-50/60 rounded-xl transition-colors text-left group">
              <div class="w-11 h-11 rounded-2xl bg-[#ECE7FD] text-brand-600 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                  <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd"/>
                </svg>
              </div>
              <div>
                <div class="text-[14px] font-bold text-ink-900">Create Task</div>
                <div class="text-[12px] text-ink-500">Stay on track</div>
              </div>
            </button>

            <!-- 4. Add Event -->
            <button onclick="openSubForm('event')" class="w-full flex items-center gap-3.5 py-3 px-1.5 hover:bg-brand-50/60 rounded-xl transition-colors text-left group">
              <div class="w-11 h-11 rounded-2xl bg-[#FEF0DC] text-[#D97706] flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="17" rx="3"/>
                  <path stroke-linecap="round" d="M8 2v4M16 2v4M3 9h18"/>
                  <rect x="7.5" y="12.5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/>
                </svg>
              </div>
              <div>
                <div class="text-[14px] font-bold text-ink-900">Add Event</div>
                <div class="text-[12px] text-ink-500">Keep your schedule</div>
              </div>
            </button>
          </div>

          <!-- Cancel Button -->
          <button onclick="closeAddNewModal()" class="mt-4 w-full py-3.5 rounded-2xl bg-[#EAE4FC] hover:bg-[#DFD6FA] text-ink-900 font-bold text-[14px] transition-colors">
            Cancel
          </button>
        </div>

        <!-- Interactive Sub-form View (When user clicks one of the 4 items above) -->
        <div id="modal-subform-view" class="hidden">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

  </div>

  <!-- Subtle Footer Caption -->
  <p class="mt-3 text-[11px] font-medium text-ink-700/75 text-center">
    Interactive Dayflow Prototype • Tap icons inside the phone or use the top screen pills
  </p>

  <script>
    // =========================================================================
    // APP STATE (Initialized with the exact figures & items from the screenshot)
    // =========================================================================
    const appState = {
      currentScreen: 'home',
      isOffline: true,
      selectedDay: 18,
      taskFilter: 'All',
      walletPeriod: 'This Month',
      // Financial metrics
      todaySpent: 250,
      todaySaved: 500,
      currentBalance: 2350.00,
      totalIncome: 3500,
      totalExpenses: 1150,
      totalSavings: 5000.00,
      // Spending breakdown
      spending: [
        { label: 'Food & Drinks', pct: 40, color: '#5D32E6' },
        { label: 'Transport', pct: 30, color: '#9370F8' },
        { label: 'Others', pct: 30, color: '#C7B6FB' }
      ],
      // Transactions
      transactions: [
        { id: 1, title: 'Food & Drinks', amount: 150, timeLabel: 'Today', homeTime: '9:20 AM', type: 'food' },
        { id: 2, title: 'Transport', amount: 50, timeLabel: 'Yesterday', homeTime: '8:45 AM', type: 'transport' }
      ],
      // Savings Goals
      goals: [
        { id: 1, title: 'Vacation Trip', saved: 2000, target: 10000, theme: 'beach' },
        { id: 2, title: 'New Laptop', saved: 5000, target: 30000, theme: 'laptop' }
      ],
      // Tasks
      tasks: [
        { id: 1, title: 'Finish UI Design', due: 'Today', priority: 'High', completed: false },
        { id: 2, title: 'Study React', due: 'Today', priority: 'Medium', completed: false },
        { id: 3, title: 'Workout', due: 'Tomorrow', priority: 'Low', completed: false },
        { id: 4, title: 'Read a book', due: 'Completed', priority: 'Low', completed: true }
      ],
      // Schedule
      weekDays: [
        { day: 'Sun', date: 16 },
        { day: 'Mon', date: 17 },
        { day: 'Tue', date: 18 },
        { day: 'Wed', date: 19 },
        { day: 'Thu', date: 20 },
        { day: 'Fri', date: 21 },
        { day: 'Sat', date: 22 }
      ],
      timelineEvents: [
        { id: 1, time: '9:00 AM', title: 'Class: Web Development', location: 'Room 301', icon: 'book' },
        { id: 2, time: '1:00 PM', title: 'Group Project Meeting', location: 'Online', icon: 'users' }
      ],
      upcomingEvents: [
        { id: 101, date: 'Nov 19', title: 'Midterm Exam', timeRange: '9:00 AM – 11:00 AM' }
      ]
    };

    // =========================================================================
    // CUSTOM SVG ILLUSTRATIONS (Logo, 3D Piggy Bank, Thumbnails, Avatar)
    // =========================================================================
    function getBrandLogoSVG() {
      return `
        <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none">
          <path d="M7 22C7 12.5 14.2 6 24.5 6C24.5 16.3 18 23.5 8.5 23.5H7V22Z" fill="#6338E8"/>

    // =========================================================================
    // NAVIGATION & RENDER ENGINE
    // =========================================================================
    function navigateTo(screen) {
      appState.currentScreen = screen;
      closeAddNewModal(true);
      updateNavIndicators(screen);
      renderScreen();
    }

    function updateNavIndicators(screen) {
      // Update top quick-switcher pills
      document.querySelectorAll('.nav-pill').forEach(btn => {
        const target = btn.getAttribute('data-nav-pill');
        if (target === screen) {
          btn.className = 'nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm';
        } else {
          btn.className = 'nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50';
        }
      });

      // Show/Hide Bottom Nav (Profile screen has no bottom nav in the showcase!)
      const bottomNav = document.getElementById('bottom-nav');
      const iosHomeBar = document.getElementById('ios-home-bar');
      if (screen === 'profile') {
        bottomNav.classList.add('hidden');
        iosHomeBar.classList.remove('hidden');
      } else {
        bottomNav.classList.remove('hidden');
        iosHomeBar.classList.add('hidden');
      }

      // Highlight active bottom nav icon
      const tabMap = {
        home: 'tab-home',
        wallet: 'tab-wallet',
        savings: 'tab-wallet',
        tasks: 'tab-home',
        schedule: 'tab-schedule',
        profile: 'tab-profile'
      };

      ['tab-home', 'tab-wallet', 'tab-schedule', 'tab-profile'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === tabMap[screen]) {
          el.classList.remove('text-[#827C99]');
          el.classList.add('text-brand-600');
        } else {
          el.classList.remove('text-brand-600');
          el.classList.add('text-[#827C99]');
        }
      });
    }

    function formatPeso(num, decimals = false) {
      return '₱' + Number(num).toLocaleString('en-PH', {
        minimumFractionDigits: decimals ? 2 : 0,
        maximumFractionDigits: decimals ? 2 : 0
      });
    }

    function showToast(message) {
      const toast = document.getElementById('app-toast');
      const textEl = document.getElementById('app-toast-text');
      textEl.textContent = message;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2200);
    }

    function renderScreen() {
      const container = document.getElementById('screen-container');
      switch (appState.currentScreen) {
        case 'home':
          container.innerHTML = renderHomeScreen();
          break;
        case 'wallet':
          container.innerHTML = renderWalletScreen();
          break;
        case 'savings':
          container.innerHTML = renderSavingsScreen();
          break;
        case 'tasks':
          container.innerHTML = renderTasksScreen();
          break;
        case 'schedule':
          container.innerHTML = renderScheduleScreen();
          break;
        case 'profile':
          container.innerHTML = renderProfileScreen();
          break;
      }
      container.scrollTop = 0;
    }

    // =========================================================================
    // SCREEN 4: TASKS (Bottom-Left in Showcase)
    // =========================================================================
    function renderTasksScreen() {
      const filteredTasks = appState.tasks.filter(t => {
        if (appState.taskFilter === 'Pending') return !t.completed;
        if (appState.taskFilter === 'Completed') return t.completed;
        return true;
      });

      const priorityBadge = (priority) => {
        if (priority === 'High') {
          return `<span class="px-2 py-0.5 rounded-full bg-[#FCE7EE] text-[#E11D48] text-[10px] font-bold">High</span>`;
        }
        if (priority === 'Medium') {
          return `<span class="px-2 py-0.5 rounded-full bg-[#FEF3C7] text-[#D97706] text-[10px] font-bold">Medium</span>`;
        }
        return `<span class="px-2 py-0.5 rounded-full bg-[#DCFCE7] text-[#16A34A] text-[10px] font-bold">Low</span>`;
      };

      const taskCards = filteredTasks.map(task => `
        <div onclick="toggleTask(${task.id})" class="bg-white rounded-[20px] px-4 py-3.5 shadow-card flex items-center gap-3.5 cursor-pointer hover:bg-brand-50/30 transition-colors">
          <!-- Checkbox Circle -->
          ${task.completed
            ? `<div class="w-6 h-6 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
                </svg>
              </div>`
            : `<div class="w-6 h-6 rounded-full border-2 border-[#C5BEDB] shrink-0"></div>`
          }

          <!-- Task Details -->
          <div class="flex-1 min-w-0">
            <div class="text-[14px] font-bold ${task.completed ? 'text-ink-900' : 'text-ink-900'} truncate">${task.title}</div>
            <div class="flex items-center gap-1.5 mt-1 text-[12px] text-ink-500">
              ${task.completed
                ? `<span>Completed</span>`
                : `<span>${task.due} •</span> ${priorityBadge(task.priority)}`
              }
            </div>
          </div>
        </div>
      `).join('');

      return `
        <div class="screen-enter px-5 pt-2 pb-20 flex-1 relative">
          <!-- Header -->
          <div class="flex items-center justify-between mb-4">
            <h1 class="text-[20px] font-extrabold text-ink-900">Tasks</h1>
            <div class="flex items-center gap-2 text-ink-900">

                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="11" cy="11" r="7"/>
                  <path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
                </svg>
              </button>
              <button onclick="showToast('Sort by Priority')" class="p-1.5 rounded-xl hover:bg-brand-100/60 transition-colors" aria-label="More options">
                <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM11.5 15.5a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Filter Pills: All | Pending | Completed -->
          <div class="flex items-center gap-2.5 mb-4">
            ${['All', 'Pending', 'Completed'].map(tab => {
              const active = appState.taskFilter === tab;
              return `
                <button onclick="setTaskFilter('${tab}')" class="px-5 py-2 rounded-full text-[12px] font-bold transition-all ${
                  active
                    ? 'bg-brand-600 text-white shadow-sm'
                    : 'bg-[#EDE9F9] text-ink-700 hover:bg-brand-100'
                }">
                  ${tab}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Task List -->
          <div class="space-y-3">
            ${taskCards}
          </div>

          <!-- Secondary Floating '+' Button on Bottom-Right (Exact match to Screen 4) -->
          <button onclick="openAddNewModal('task')" class="fixed-in-phone absolute bottom-6 right-5 w-12 h-12 rounded-full bg-brand-600 hover:bg-brand-700 text-white shadow-fab flex items-center justify-center transition-transform active:scale-95" aria-label="New Task">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
          </button>
        </div>
      `;
    }

    // =========================================================================
    // SCREEN 6: ADD NEW MODAL & INTERACTIVE CREATION FORMS
    // =========================================================================
    function openAddNewModal(directForm = null) {
      const modal = document.getElementById('add-new-modal');
      const menuView = document.getElementById('modal-menu-view');
      const subformView = document.getElementById('modal-subform-view');

      modal.classList.remove('hidden');

      // Highlight modal pill in top switcher
      document.querySelectorAll('.nav-pill').forEach(btn => {
        if (btn.getAttribute('data-nav-pill') === 'modal') {
          btn.className = 'nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-brand-600 text-white shadow-sm';
        } else {
          btn.className = 'nav-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-ink-700 hover:bg-brand-50';
        }
      });

      if (directForm) {
        openSubForm(directForm);
      } else {
        menuView.classList.remove('hidden');
        subformView.classList.add('hidden');
      }
    }

    function closeAddNewModal(skipPillReset = false) {
      const modal = document.getElementById('add-new-modal');
      modal.classList.add('hidden');
      if (!skipPillReset) {
        updateNavIndicators(appState.currentScreen);
      }
    }

    function openSubForm(type) {
      const menuView = document.getElementById('modal-menu-view');
      const subformView = document.getElementById('modal-subform-view');
      menuView.classList.add('hidden');
      subformView.classList.remove('hidden');

      if (type === 'expense') {
        subformView.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <button onclick="openAddNewModal()" class="text-xs font-semibold text-ink-500 hover:text-ink-900">← Back</button>
            <h3 class="text-[16px] font-bold text-ink-900">Add Expense</h3>
            <span class="w-8"></span>
          </div>
          <form onsubmit="submitExpense(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-ink-700 mb-1">Category</label>
              <select id="exp-title" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none">
                <option value="Food & Drinks">Food & Drinks</option>
                <option value="Transport">Transport</option>
                <option value="Others">Others</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-ink-700 mb-1">Amount (₱)</label>
              <input id="exp-amount" type="number" min="1" required placeholder="e.g. 120" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-bold text-ink-900 outline-none" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-sm shadow-hero mt-1">Save Expense</button>
          </form>
        `;
      } else if (type === 'goal') {
        subformView.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <button onclick="openAddNewModal()" class="text-xs font-semibold text-ink-500 hover:text-ink-900">← Back</button>
            <h3 class="text-[16px] font-bold text-ink-900">Create Savings Goal</h3>
            <span class="w-8"></span>
          </div>
          <form onsubmit="submitGoal(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-ink-700 mb-1">Goal Name</label>
              <input id="goal-title" type="text" required placeholder="e.g. Emergency Fund" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Initial Saved (₱)</label>
                <input id="goal-saved" type="number" min="0" value="500" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-bold text-ink-900 outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Target (₱)</label>
                <input id="goal-target" type="number" min="100" value="5000" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-bold text-ink-900 outline-none" />
              </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-sm shadow-hero mt-1">Create Goal</button>
          </form>
        `;
      } else if (type === 'task') {
        subformView.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <button onclick="openAddNewModal()" class="text-xs font-semibold text-ink-500 hover:text-ink-900">← Back</button>
            <h3 class="text-[16px] font-bold text-ink-900">Create Task</h3>
            <span class="w-8"></span>
          </div>
          <form onsubmit="submitTask(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-ink-700 mb-1">Task Title</label>
              <input id="task-title" type="text" required placeholder="e.g. Review Figma Prototype" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Due</label>
                <select id="task-due" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none">
                  <option value="Today">Today</option>
                  <option value="Tomorrow">Tomorrow</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Priority</label>
                <select id="task-priority" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none">
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-sm shadow-hero mt-1">Add Task</button>
          </form>
        `;
      } else if (type === 'event') {
        subformView.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <button onclick="openAddNewModal()" class="text-xs font-semibold text-ink-500 hover:text-ink-900">← Back</button>
            <h3 class="text-[16px] font-bold text-ink-900">Add Event</h3>
            <span class="w-8"></span>
          </div>
          <form onsubmit="submitEvent(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-ink-700 mb-1">Event Title</label>
              <input id="ev-title" type="text" required placeholder="e.g. Design Critique" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Time</label>
                <input id="ev-time" type="text" value="3:30 PM" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-ink-700 mb-1">Location</label>
                <input id="ev-loc" type="text" value="Room 204" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F1FE] text-sm font-semibold text-ink-900 outline-none" />

    // =========================================================================
    // INTERACTIVE STATE MUTATIONS
    // =========================================================================
    function toggleOfflineStatus() {
      appState.isOffline = !appState.isOffline;
      renderScreen();
      showToast(appState.isOffline ? 'Switched to Offline mode' : 'All data synced');
    }

    function cycleWalletPeriod() {
      const periods = ['This Month', 'This Week', 'All Time'];
      const idx = periods.indexOf(appState.walletPeriod);
      appState.walletPeriod = periods[(idx + 1) % periods.length];
      renderScreen();
    }

    function topUpGoal(id) {
      const goal = appState.goals.find(g => g.id === id);
      if (!goal) return;
      goal.saved = Math.min(goal.target, goal.saved + 500);
      appState.totalSavings += 500;
      renderScreen();
      showToast(`Added ₱500 to ${goal.title}!`);
    }

    function setTaskFilter(filter) {
      appState.taskFilter = filter;
      renderScreen();
    }

    function toggleTask(id) {
      const task = appState.tasks.find(t => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      if (task.completed && task.due !== 'Completed') {
        task._prevDue = task.due;
        task.due = 'Completed';
      } else if (!task.completed && task._prevDue) {
        task.due = task._prevDue;
      }
      renderScreen();
    }

    function selectScheduleDay(date) {
      appState.selectedDay = date;
      renderScreen();
    }

    function submitExpense(e) {
      e.preventDefault();
      const title = document.getElementById('exp-title').value;
      const amount = Number(document.getElementById('exp-amount').value);
      if (!amount || amount <= 0) return;

      appState.todaySpent += amount;
      appState.totalExpenses += amount;
      appState.currentBalance = Math.max(0, appState.currentBalance - amount);
      appState.transactions.unshift({
        id: Date.now(),
        title,
        amount,
        timeLabel: 'Today',
        homeTime: 'Just now',
        type: title === 'Transport' ? 'transport' : 'food'
      });

      closeAddNewModal();
      navigateTo('wallet');
      showToast(`Added ${formatPeso(amount)} expense`);
    }

    function submitGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goal-title').value.trim();
      const saved = Number(document.getElementById('goal-saved').value);
      const target = Number(document.getElementById('goal-target').value);
      if (!title || target <= 0) return;

      appState.goals.push({
        id: Date.now(),
        title,
        saved,
        target,
        theme: appState.goals.length % 2 === 0 ? 'beach' : 'laptop'
      });
      appState.totalSavings += saved;

      closeAddNewModal();
      navigateTo('savings');
      showToast(`Goal "${title}" created!`);
    }

    function submitTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const due = document.getElementById('task-due').value;
      const priority = document.getElementById('task-priority').value;
      if (!title) return;

      appState.tasks.unshift({
        id: Date.now(),
        title,
        due,
        priority,
        completed: false
      });

      closeAddNewModal();
      navigateTo('tasks');
      showToast(`Task "${title}" added!`);
    }

    function submitEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value.trim();
      const time = document.getElementById('ev-time').value.trim();
      const location = document.getElementById('ev-loc').value.trim();
      if (!title) return;

      appState.timelineEvents.push({
        id: Date.now(),
        time,
        title,
        location,
        icon: 'book'
      });

      closeAddNewModal();
      navigateTo('schedule');
      showToast(`Scheduled "${title}"`);
    }

    function resetDemoData() {
      appState.todaySpent = 250;
      appState.todaySaved = 500;
      appState.currentBalance = 2350.00;
      appState.totalIncome = 3500;
      appState.totalExpenses = 1150;
      appState.totalSavings = 5000.00;
      appState.transactions = [
        { id: 1, title: 'Food & Drinks', amount: 150, timeLabel: 'Today', homeTime: '9:20 AM', type: 'food' },
        { id: 2, title: 'Transport', amount: 50, timeLabel: 'Yesterday', homeTime: '8:45 AM', type: 'transport' }
      ];
      appState.goals = [
        { id: 1, title: 'Vacation Trip', saved: 2000, target: 10000, theme: 'beach' },
        { id: 2, title: 'New Laptop', saved: 5000, target: 30000, theme: 'laptop' }
      ];
      appState.tasks = [
        { id: 1, title: 'Finish UI Design', due: 'Today', priority: 'High', completed: false },
        { id: 2, title: 'Study React', due: 'Today', priority: 'Medium', completed: false },
        { id: 3, title: 'Workout', due: 'Tomorrow', priority: 'Low', completed: false },
        { id: 4, title: 'Read a book', due: 'Completed', priority: 'Low', completed: true }
      ];
      navigateTo('home');
      showToast('Restored original showcase data');
    }

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      navigateTo('home');
    });
  </script>
